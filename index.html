<style>
/* MoRD Programmes · independent explainer · data: PRS Legislative Research, Lok Sabha answers (2025) */
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: split hero (headline left, photograph right) → three ease tiles → 4+3 photo grid →
   sand budget panel → year rail → photo band. Programme page: photo banner, fact strip, pill tabs, step cards. */
:root{
  --paper:#F7F1E8; --surface:#FFFCF7; --sand:#EFE4D4; --line:#E4D6C3;
  --ink:#260D07; --muted:#6E5A4F; --brand:#693D30; --brand-ink:#FFF8F0;
  --ochre:#B97A2A; --ochre-soft:#F4E4C8; --shade:rgba(38,13,7,.14);
  --on-photo:#FFF8F0; --photo-ink:#2A120A; --glass:rgba(255,248,240,.18); --glass-line:rgba(255,248,240,.34);
  --scrim:rgba(24,9,4,.80);
  --m1:#F0DFC4; --m2:#DDB98C; --m3:#C08757; --m4:#925638; --m5:#5C2C1D;
  --f-display:'Fraunces','Noto Serif Devanagari','Noto Serif Bengali','Noto Serif Tamil','Noto Serif Telugu',Georgia,'Times New Roman',serif;
  --f-body:'DM Sans','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Telugu',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:1.75rem; --r-md:1.125rem; --r-sm:.75rem;
  --gut:max(clamp(1rem,4vw,2.5rem), env(safe-area-inset-left,0px));
  --gut-r:max(clamp(1rem,4vw,2.5rem), env(safe-area-inset-right,0px));
}

html{font-size:100%;color-scheme:light} html.lg{font-size:118.75%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
html:not([lang="en"]) body{line-height:1.7}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ochre);outline-offset:3px;border-radius:6px}
.wrap{max-width:76rem;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
.ico{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.h2{font-family:var(--f-display);font-weight:500;font-size:clamp(1.75rem,3.2vw,2.5rem);line-height:1.15;letter-spacing:-.01em;margin:0;text-wrap:balance}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin:0 0 .6rem}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:.75rem;min-height:4.25rem}
.brand{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;cursor:pointer;text-align:left;padding:0;margin-right:auto;min-width:0}
.brand b{white-space:nowrap;font-family:var(--f-display);font-size:1.3rem;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.brand small{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tools{display:flex;gap:.5rem;align-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:.5rem;height:2.5rem;padding:0 1rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.875rem;cursor:pointer;transition:border-color .2s,background .2s}
.pill:hover{border-color:var(--brand)}
.pill.accent{border-color:var(--brand);color:var(--brand)}
.pill.on,.pill[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.aa{font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;height:2.5rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .875rem var(--f-body);padding:0 2.1rem 0 2.35rem;cursor:pointer}
.sel select:hover{border-color:var(--brand)}
.sel .ico{position:absolute;pointer-events:none;width:1.05rem;height:1.05rem;color:var(--brand)}
.sel .ico.g{left:.85rem} .sel .ico.c{right:.8rem;color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:1.02fr 1fr;gap:clamp(2rem,5vw,4.5rem);align-items:center;padding-block:clamp(2rem,5vw,4rem) 0}
.hero h1{font-family:var(--f-display);font-weight:500;font-size:clamp(2.5rem,5.4vw,4.4rem);line-height:1.03;letter-spacing:-.025em;text-wrap:balance;margin:0}
html:not([lang="en"]) .hero h1{font-size:clamp(2rem,4.2vw,3.3rem);line-height:1.3;letter-spacing:0}
.hero .sub{font-size:1.125rem;color:var(--muted);max-width:34rem;margin:1.25rem 0 2rem}
.cta{display:inline-flex;align-items:center;gap:.65rem;min-height:3.25rem;padding:.5rem 1.5rem;border-radius:999px;background:var(--brand);color:var(--brand-ink);border:0;font-weight:600;font-size:1rem;cursor:pointer;transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-1px);box-shadow:0 12px 24px -14px var(--brand)}
.cta .ico{transition:transform .2s} .cta:hover .ico{transform:translateX(3px)}
.hero figure{margin:0;position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:1/1.04;max-width:100%;box-shadow:0 40px 70px -40px var(--shade)}
.hero figure img{width:100%;height:100%;object-fit:cover;object-position:52% 40%;display:block}
.chip{position:absolute;left:1rem;bottom:1rem;right:auto;background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:var(--r-md);padding:.8rem 1.1rem;display:flex;flex-direction:column;max-width:calc(100% - 2rem)}
.chip b{font-family:var(--f-display);font-weight:500;font-size:1.45rem;color:var(--brand);line-height:1.15;font-variant-numeric:tabular-nums}
.chip span{font-size:.8rem;color:var(--muted)}

/* ease tiles */
.ease{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:clamp(2rem,4vw,3rem)}
.ease button{display:flex;align-items:center;gap:1rem;padding:1.05rem 1.2rem;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);text-align:left;cursor:pointer;transition:border-color .2s,transform .2s;min-width:0}
.ease button:hover{border-color:var(--brand);transform:translateY(-2px)}
.ease .ic{width:3rem;height:3rem;border-radius:50%;background:var(--sand);color:var(--brand);display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.ease .ic .ico{width:1.45rem;height:1.45rem}
.ease .ic .aa{font-size:1.25rem}
.ease b{display:block;font-weight:600;line-height:1.3}
.ease small{color:var(--muted);font-size:.85rem}
.ease button[aria-pressed="true"]{border-color:var(--brand)}
.ease button[aria-pressed="true"] .ic{background:var(--brand);color:var(--brand-ink)}

/* glance */
.glance{display:grid;grid-template-columns:repeat(4,1fr);margin-top:clamp(2.5rem,5vw,3.5rem);border-block:1px solid var(--line)}
.glance div{padding:1.4rem 1.25rem;border-left:1px solid var(--line);min-width:0}
.glance div:first-child{border-left:0;padding-left:0}
.glance b{font-family:var(--f-display);font-size:clamp(1.5rem,2.6vw,2.05rem);font-weight:500;color:var(--brand);display:block;line-height:1.15;font-variant-numeric:tabular-nums}
.glance span{color:var(--muted);font-size:.875rem;line-height:1.4;display:block;margin-top:.3rem}

/* sections */
.sec{padding-top:clamp(3rem,6vw,5rem);scroll-margin-top:5rem}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem 2rem;margin-bottom:1.75rem;flex-wrap:wrap}
.sh p{color:var(--muted);margin:0;max-width:30rem}

/* programme grid: 4 + 3 */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:1.25rem}
.card{grid-column:span 3;position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .3s ease,box-shadow .3s ease;min-width:0}
.card:nth-child(n+5){grid-column:span 4}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 44px -28px var(--shade)}
.card .ph{position:relative;height:12.5rem;overflow:hidden;display:block}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease}
.card:hover img{transform:scale(1.05)}
.tag{position:absolute;top:.75rem;left:.75rem;background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--brand);font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:.3rem .65rem;border-radius:999px}
.card .bd{display:grid;grid-template-columns:auto 1fr auto;column-gap:.85rem;row-gap:.2rem;align-items:start;padding:1rem 1.1rem 1.2rem;flex:1}
.card .pi{grid-row:1/span 2;width:2.6rem;height:2.6rem;border-radius:.75rem;background:var(--sand);color:var(--brand);display:grid;place-items:center}
.card .nm{grid-column:2;font-weight:600;font-size:1.02rem;line-height:1.3}
.card .ln{grid-column:2;color:var(--muted);font-size:.875rem;line-height:1.45}
.card .go{grid-column:3;grid-row:1/span 2;align-self:center;color:var(--brand);transition:transform .2s}
.card:hover .go{transform:translateX(3px)}

/* money */
.money{background:var(--sand);border-radius:var(--r-lg);padding:clamp(1.5rem,4vw,3rem);display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(1.5rem,4vw,3.5rem)}
.total{margin-top:1.5rem}
.total b{display:block;font-family:var(--f-display);font-weight:500;font-size:clamp(2.2rem,4.5vw,3.25rem);color:var(--brand);line-height:1.05;font-variant-numeric:tabular-nums}
.total span{color:var(--muted);font-size:.9rem}
.bars{display:flex;flex-direction:column;min-width:0}
.brow{display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;padding:.75rem 0;border:0;border-bottom:1px solid var(--line);border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent);background:none;width:100%;text-align:left;cursor:pointer}
.brow:last-child{border-bottom:0}
.brow .bl{font-weight:600;min-width:0}
.brow .bl small{font-weight:500;color:var(--muted);margin-left:.5rem;font-size:.78rem;letter-spacing:.02em}
.brow .bv{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.track{grid-column:1/-1;height:.55rem;border-radius:999px;background:var(--line);background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden}
.fill{display:block;height:100%;border-radius:999px;background:var(--brand)}
.brow.dim{cursor:default}
.brow.dim .bl{font-weight:500;color:var(--muted)}
.brow.dim .fill{background:repeating-linear-gradient(135deg,var(--ochre) 0 6px,color-mix(in srgb,var(--ochre) 55%,transparent) 6px 10px)}
button.brow:hover .bl{color:var(--brand)}

/* year rail */
.rail{display:grid;grid-template-columns:repeat(8,minmax(8.75rem,1fr));overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:.75rem}
.yr{position:relative;text-align:left;background:none;border:0;border-top:2px solid var(--line);padding:1.4rem 1rem 0 0;cursor:pointer;scroll-snap-align:start;display:flex;flex-direction:column;gap:.15rem}
.yr::before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--brand)}
.yr:last-child::before{background:var(--ochre);border-color:var(--ochre)}
.yr .y{font-family:var(--f-display);font-size:1.7rem;font-weight:500;color:var(--brand);line-height:1.1;font-variant-numeric:tabular-nums}
.yr b{font-size:.9rem}
.yr span:last-child{color:var(--muted);font-size:.85rem;line-height:1.35}
.yr:hover b{color:var(--brand)}

/* band */
.band{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:clamp(17rem,32vw,22rem);display:grid;place-items:center;text-align:center;color:var(--on-photo);isolation:isolate}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;z-index:-2}
.band::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(24,9,4,.38) 0%,rgba(24,9,4,.08) 55%,rgba(24,9,4,.25) 100%)}
.band{place-items:start center}
.band .in{padding:clamp(2rem,4vw,3rem) 1.5rem 7rem;display:flex;flex-direction:column;align-items:center;gap:1.4rem}
.band h2{font-family:var(--f-display);font-weight:500;font-size:clamp(1.9rem,4.2vw,3.1rem);line-height:1.15;margin:0;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.25)}
.cta.light{background:var(--on-photo);color:var(--photo-ink)}

.foot{margin-top:clamp(3rem,6vw,4.5rem);border-top:1px solid var(--line);padding-block:2rem 3rem;color:var(--muted);font-size:.875rem}
.foot a{color:var(--brand);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}

/* programme page */
.crumbrow{padding-block:1.25rem .9rem}
.crumb{display:inline-flex;gap:.5rem;align-items:center;background:none;border:0;color:var(--muted);font-weight:500;font-size:.92rem;cursor:pointer;padding:.25rem 0}
.crumb:hover{color:var(--brand)}
.pb{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:clamp(21rem,42vw,29rem);display:flex;align-items:flex-end;color:var(--on-photo);isolation:isolate}
.pb>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.pb::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(24,9,4,.80) 0%,rgba(24,9,4,.42) 55%,rgba(24,9,4,.08) 100%),linear-gradient(0deg,rgba(24,9,4,.45),transparent 50%)}
.pb .in{padding:clamp(1.5rem,4vw,3rem) clamp(1.5rem,4vw,3rem) clamp(3.75rem,6vw,4.5rem);max-width:42rem;display:flex;flex-direction:column;gap:.7rem}
.pic{width:3.4rem;height:3.4rem;border-radius:1rem;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--glass-line);display:grid;place-items:center}
.pic .ico{width:1.7rem;height:1.7rem}
.pb h1{font-family:var(--f-display);font-weight:500;font-size:clamp(2.3rem,5vw,3.8rem);line-height:1.05;letter-spacing:-.02em;margin:.3rem 0 0;text-wrap:balance}
html:not([lang="en"]) .pb h1{line-height:1.3;letter-spacing:0;font-size:clamp(2rem,4.2vw,3.1rem)}
.pb .full{font-size:.85rem;opacity:.85;margin:0}
.pb .line{font-size:1.12rem;margin:0;opacity:.95;max-width:34rem}
.facts{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin:-2.4rem clamp(1rem,3vw,2.5rem) 0;position:relative;z-index:2;box-shadow:0 24px 44px -30px var(--shade)}
.facts>div{display:flex;align-items:center;gap:.9rem;padding:1.1rem 1.3rem;min-width:0}
.facts>div+div{border-left:1px solid var(--line)}
.facts .fi{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--sand);color:var(--brand);display:grid;place-items:center;flex:none}
.facts .dt{display:block;font-size:.78rem;color:var(--muted)}
.facts .dd{display:block;margin:0;font-weight:600;font-size:1.05rem;line-height:1.3;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:.3rem;padding:.35rem;background:var(--sand);border-radius:999px;overflow-x:auto;margin-top:2.75rem;width:max-content;max-width:100%;scrollbar-width:none}
.tab{border:0;background:none;border-radius:999px;padding:.7rem 1.2rem;font-weight:500;font-size:.95rem;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 3px 10px -5px var(--shade)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:2.25rem 0 1.25rem;flex-wrap:wrap}
.phead .h2{font-size:clamp(1.5rem,2.6vw,2rem)}
.items{list-style:none;padding:0;margin:0;display:grid;gap:.75rem;max-width:54rem}
.items li{display:flex;gap:1rem;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:1.1rem 1.3rem;font-size:1.05rem}
.items .mk{width:2.1rem;height:2.1rem;border-radius:50%;background:var(--sand);color:var(--brand);display:grid;place-items:center;flex:none}
.items .mk .ico{width:1.1rem;height:1.1rem}
.items.warn .mk{background:var(--ochre-soft);color:var(--ochre)}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:1.25rem}
.steps li{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:1.3rem 1.25rem 1.4rem;display:flex;flex-direction:column;gap:.55rem;min-width:0}
.steps li:not(:last-child)::after{content:"";position:absolute;top:2.15rem;right:-1.25rem;width:1.25rem;border-top:2px dashed var(--line)}
.steps .num{width:1.9rem;height:1.9rem;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.steps .si{width:4.25rem;height:4.25rem;border-radius:1.1rem;background:var(--sand);color:var(--brand);display:grid;place-items:center;margin:.6rem 0 .35rem}
.steps .si .ico{width:2.1rem;height:2.1rem;stroke-width:1.4}
.steps b{font-size:1.05rem;line-height:1.3}
.steps span{color:var(--muted);font-size:.93rem;line-height:1.5}
.pstats{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;max-width:54rem}
.pstats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:1.4rem 1.5rem}
.pstats b{display:block;font-family:var(--f-display);font-weight:500;font-size:clamp(2rem,4vw,2.75rem);color:var(--brand);line-height:1.1;font-variant-numeric:tabular-nums}
.pstats span{color:var(--muted);font-size:.95rem}
.meter{margin-top:1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:1.3rem 1.5rem;max-width:54rem;box-sizing:border-box}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.85rem}
.meter p{margin:0;font-weight:500}
.meter b{font-family:var(--f-display);font-size:1.8rem;font-weight:500;color:var(--brand);font-variant-numeric:tabular-nums}
.meter .tr{height:.8rem;border-radius:999px;background:var(--sand);overflow:hidden}
.meter .fl{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ochre),var(--brand))}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:2.75rem;padding-top:1.5rem;border-top:1px solid var(--line);flex-wrap:wrap}
.navbtn{display:inline-flex;align-items:center;gap:.6rem;min-height:3rem;padding:.4rem 1.3rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;transition:border-color .2s}
.navbtn:hover{border-color:var(--brand)}
.navbtn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

home:{name:'ग्रामीण आवास',line:'जिन परिवारों के पास पक्का घर नहीं, उनके लिए घर',about:['घर बनाने के लिए ₹1.2 लाख (पहाड़ी इलाकों में ₹1.3 लाख) किस्तों में देता है।','परिवार ब्याज में मदद के साथ ₹70,000 तक का बैंक लोन भी ले सकते हैं।','2016 में इंदिरा आवास योजना की जगह शुरू हुआ; 2028–29 तक बढ़ाया गया।'],s1v:'2.89 करोड़',s1l:'घर पूरे हुए (दिसंबर 2025)',s2v:'4.15 करोड़',s2l:'घरों का लक्ष्य',pct:'लक्ष्य का 70% पूरा',ch:['भूमिहीन परिवारों को सबसे लंबा इंतज़ार करना पड़ता है, क्योंकि पहले ज़मीन चाहिए।','2025–26 में खर्च बजट से 41% कम रहा।','संसदीय समिति ने सहायता बढ़ाकर ₹4 लाख प्रति घर करने की सिफ़ारिश की है।']},
road:{name:'ग्रामीण सड़कें',line:'बिना सड़क वाले गाँवों तक हर मौसम की सड़क',about:['पक्की सड़कें बनाता है जो हर मौसम में गाँवों को बाज़ार, स्कूल और अस्पताल से जोड़ती हैं।','2000 से चल रहा है। चौथा चरण (2024–29) 62,500 किमी सड़क से 25,000 और बस्तियों को जोड़ेगा।'],s1v:'7.88 लाख किमी',s1l:'सड़क बनी',s2v:'8.36 लाख किमी',s2l:'मंज़ूर',pct:'मंज़ूर सड़कों का 94% पूरा',ch:['आदिवासी और वामपंथी उग्रवाद प्रभावित इलाकों में काम सबसे धीमा है।','राष्ट्रीय निरीक्षकों की 24% रखरखाव जाँचों में सड़कें असंतोषजनक मिलीं।']},
women:{name:'महिला स्वयं सहायता समूह',line:'महिला समूहों के ज़रिए बचत, कर्ज़ और रोज़गार',about:['गरीब ग्रामीण परिवारों की महिलाओं को स्वयं सहायता समूहों में जोड़ता है, जो मिलकर बचत करती और कर्ज़ देती हैं।','समूहों को ₹20,000–30,000 का रिवॉल्विंग फंड और रोज़गार में लगाने के लिए ₹2.5 लाख तक मिलते हैं।','समूह छोटे व्यवसाय शुरू करने या बढ़ाने के लिए बैंक से कर्ज़ लेते हैं।'],s1v:'92 लाख',s1l:'स्वयं सहायता समूह, 10 करोड़ से ज़्यादा परिवार',s2v:'₹1.2 लाख करोड़',s2l:'2025–26 में 44 लाख समूहों को बैंक कर्ज़',pct:'2025–26 में लगभग 48% समूहों ने बैंक कर्ज़ लिया',ch:['2025–26 में लगभग आधे समूहों ने बैंक कर्ज़ नहीं लिया।']},
skills:{name:'ग्रामीण युवाओं के लिए कौशल',line:'नौकरी से जुड़ा मुफ़्त प्रशिक्षण',about:['गरीब ग्रामीण परिवारों के युवाओं को नौकरी के लिए मुफ़्त प्रशिक्षण देता है।','प्रशिक्षण नौकरी से जुड़ा है; कम से कम 70% प्रशिक्षुओं को नौकरी दिलाने का दिशानिर्देश है।','राष्ट्रीय ग्रामीण आजीविका मिशन का हिस्सा है।'],s1v:'14.7 लाख',s1l:'युवाओं को प्रशिक्षण (2016 से अगस्त 2025)',s2v:'69%',s2l:'प्रशिक्षितों को नौकरी मिली',pct:'हर 100 प्रशिक्षितों में से 69 को नौकरी मिली',ch:['मार्च 2025 में 2,369 में से सिर्फ़ 629 प्रशिक्षण केंद्र चल रहे थे।','नौकरी की दर 70% के दिशानिर्देश से थोड़ी कम है।']},
pension:{name:'सामाजिक पेंशन',line:'बुज़ुर्गों, विधवाओं और दिव्यांगजनों के लिए मासिक पेंशन',about:['पाँच योजनाएँ: वृद्धावस्था, विधवा और दिव्यांग पेंशन, पारिवारिक लाभ, और अन्नपूर्णा खाद्य सहायता।','केंद्र वृद्धावस्था पेंशन के लिए ₹200 महीना (80 साल से ₹500) देता है; राज्य ₹50 से ₹3,200 तक जोड़ते हैं।','राज्य चलाते हैं, गरीबी रेखा से नीचे के परिवारों के लिए।'],s1v:'₹200–500',s1l:'केंद्र की मासिक वृद्धावस्था पेंशन',s2v:'67%',s2l:'2025–26 में पेंशन राशि का उपयोग',ch:['CAG ऑडिट में राशि भेजने में देरी पाई गई।','कुछ राज्य हर महीने नहीं, बल्कि तिमाही या साल में एक बार भुगतान करते हैं।','राशि महँगाई के साथ नहीं बढ़ी है।']},
land:{name:'भूमि रिकॉर्ड और वाटरशेड',line:'डिजिटल भूमि रिकॉर्ड और बारिश पर निर्भर ज़मीन का बेहतर उपयोग',about:['भूमि रिकॉर्ड को कंप्यूटर पर लाता है और गाँव के नक्शे डिजिटल करता है, ताकि मालिकाना हक जाँचना आसान हो।','वाटरशेड परियोजनाएँ बारिश पर निर्भर और बंजर ज़मीन पर चेक डैम, तालाब और मिट्टी का काम करती हैं।','भूमि संसाधन विभाग चलाता है।'],s1v:'100%',s1l:'भूमि रिकॉर्ड (अधिकार अभिलेख) कंप्यूटर पर',s2v:'15%',s2l:'तय भूमि सर्वे और पुनः सर्वे पूरे',pct:'तय सर्वे का 15% पूरा',ch:['भूमि सर्वे और पुनः सर्वे बहुत पीछे हैं।','2025–26 में वाटरशेड बजट का सिर्फ़ 40% उपयोग हुआ।']}

work:{name:'গ্রামীণ কর্মসংস্থান',line:'গ্রামীণ পরিবারের জন্য মজুরির কাজের আইনি নিশ্চয়তা',about:['প্রতিটি গ্রামীণ পরিবার বছরে 125 দিন পর্যন্ত মজুরির কাজ চাইতে পারে। MGNREGA-তে এটি ছিল 100 দিন।','এই কাজে গ্রামে পুকুর, কুয়ো, চেক ড্যাম ও রাস্তার মতো সম্পদ তৈরি হয়।','এখন খরচ কেন্দ্র ও রাজ্য 60:40 ভাগ করে (উত্তর-পূর্ব ও হিমালয়ের রাজ্যে 90:10)। 1 জুলাই 2026 থেকে নতুন আইন MGNREGA-র জায়গা নিচ্ছে।'],s1v:'125 দিন',s1l:'প্রতি বছর প্রতি পরিবারের কাজের নিশ্চয়তা',s2v:'48 দিন',s2l:'গত দশকে একটি পরিবার বছরে গড়ে যত দিন কাজ পেয়েছে',pct:'গড়ে পরিবারগুলি নিশ্চিত 100 দিনের মধ্যে 48 দিন কাজ পেয়েছে',ch:['10টির মধ্যে 1টিরও কম পরিবার 100 দিনের কাজ পূর্ণ করেছে।','2025–26 সালে 31টির মধ্যে 20টি রাজ্য/কেন্দ্রশাসিত অঞ্চলে মজুরি নির্ধারিত হারের কম দেওয়া হয়েছে।','2025–26 সালে বেকার ভাতার বকেয়ার মাত্র 2% দেওয়া হয়েছে।']},

road:{name:'গ্রামীণ রাস্তা',line:'যোগাযোগহীন গ্রামে সব ঋতুর রাস্তা',about:['পাকা রাস্তা তৈরি করে যা সব ঋতুতে গ্রামকে বাজার, স্কুল ও হাসপাতালের সঙ্গে যুক্ত করে।','2000 সাল থেকে চলছে। চতুর্থ পর্যায় (2024–29) 62,500 কিমি রাস্তা দিয়ে আরও 25,000 বসতি যুক্ত করবে।'],s1v:'7.88 লাখ কিমি',s1l:'রাস্তা তৈরি',s2v:'8.36 লাখ কিমি',s2l:'অনুমোদিত',pct:'অনুমোদিত রাস্তার 94% সম্পূর্ণ',ch:['আদিবাসী ও বামপন্থী উগ্রবাদ-প্রভাবিত এলাকায় কাজ সবচেয়ে ধীর।','জাতীয় পরিদর্শকদের রক্ষণাবেক্ষণ পরিদর্শনের 24%-এ রাস্তা অসন্তোষজনক পাওয়া গেছে।']},
women:{name:'মহিলা স্বনির্ভর গোষ্ঠী',line:'মহিলা গোষ্ঠীর মাধ্যমে সঞ্চয়, ঋণ ও জীবিকা',about:['দরিদ্র গ্রামীণ পরিবারের মহিলাদের স্বনির্ভর গোষ্ঠীতে যুক্ত করে, যারা একসঙ্গে সঞ্চয় ও ঋণ দেন।','গোষ্ঠীগুলি ₹20,000–30,000 আবর্তনশীল তহবিল এবং জীবিকায় বিনিয়োগের জন্য ₹2.5 লাখ পর্যন্ত পায়।','ছোট ব্যবসা শুরু বা বাড়াতে গোষ্ঠীগুলি ব্যাংক থেকে ঋণ নেয়।'],s1v:'92 লাখ',s1l:'স্বনির্ভর গোষ্ঠী, 10 কোটিরও বেশি পরিবার',s2v:'₹1.2 লাখ কোটি',s2l:'2025–26 সালে 44 লাখ গোষ্ঠীকে ব্যাংক ঋণ',pct:'2025–26 সালে প্রায় 48% গোষ্ঠী ব্যাংক ঋণ নিয়েছে',ch:['2025–26 সালে প্রায় অর্ধেক গোষ্ঠী ব্যাংক ঋণ নেয়নি।']},
skills:{name:'গ্রামীণ যুবকদের দক্ষতা',line:'চাকরির সঙ্গে যুক্ত বিনামূল্যে প্রশিক্ষণ',about:['দরিদ্র গ্রামীণ পরিবারের যুবক-যুবতীদের চাকরির জন্য বিনামূল্যে প্রশিক্ষণ দেয়।','প্রশিক্ষণ চাকরির সঙ্গে যুক্ত; অন্তত 70% প্রশিক্ষণার্থীকে চাকরি দেওয়ার নির্দেশিকা আছে।','জাতীয় গ্রামীণ জীবিকা মিশনের অংশ।'],s1v:'14.7 লাখ',s1l:'যুবক-যুবতী প্রশিক্ষিত (2016 থেকে আগস্ট 2025)',s2v:'69%',s2l:'প্রশিক্ষিতদের চাকরি হয়েছে',pct:'প্রতি 100 জন প্রশিক্ষিতের মধ্যে 69 জন চাকরি পেয়েছেন',ch:['মার্চ 2025-এ 2,369টির মধ্যে মাত্র 629টি প্রশিক্ষণ কেন্দ্র চালু ছিল।','চাকরির হার 70% নির্দেশিকার চেয়ে সামান্য কম।']},
pension:{name:'সামাজিক পেনশন',line:'বয়স্ক, বিধবা ও প্রতিবন্ধী মানুষদের মাসিক পেনশন',about:['পাঁচটি প্রকল্প: বার্ধক্য, বিধবা ও প্রতিবন্ধী পেনশন, পারিবারিক সুবিধা এবং অন্নপূর্ণা খাদ্য সহায়তা।','বার্ধক্য পেনশনে কেন্দ্র মাসে ₹200 (80 বছর থেকে ₹500) দেয়; রাজ্য ₹50 থেকে ₹3,200 পর্যন্ত যোগ করে।','রাজ্যগুলি চালায়, দারিদ্র্যসীমার নিচের পরিবারের জন্য।'],s1v:'₹200–500',s1l:'কেন্দ্রের মাসিক বার্ধক্য পেনশন',s2v:'67%',s2l:'2025–26 সালে পেনশন তহবিলের ব্যবহার',ch:['CAG অডিটে তহবিল পাঠাতে দেরি পাওয়া গেছে।','কিছু রাজ্য প্রতি মাসে নয়, ত্রৈমাসিক বা বছরে একবার দেয়।','অঙ্ক জীবনযাত্রার খরচের সঙ্গে বাড়েনি।']},
land:{name:'জমির রেকর্ড ও জলবিভাজিকা',line:'ডিজিটাল জমির রেকর্ড ও বৃষ্টিনির্ভর জমির ভালো ব্যবহার',about:['জমির রেকর্ড কম্পিউটারে তোলে এবং গ্রামের মানচিত্র ডিজিটাল করে, যাতে মালিকানা যাচাই সহজ হয়।','জলবিভাজিকা প্রকল্প বৃষ্টিনির্ভর ও অনুর্বর জমিতে চেক ড্যাম, পুকুর ও মাটির কাজ করে।','ভূমি সম্পদ বিভাগ চালায়।'],s1v:'100%',s1l:'জমির রেকর্ড (স্বত্বলিপি) কম্পিউটারে',s2v:'15%',s2l:'পরিকল্পিত জমি জরিপ ও পুনর্জরিপ সম্পূর্ণ',pct:'পরিকল্পিত জরিপের 15% সম্পূর্ণ',ch:['জমি জরিপ ও পুনর্জরিপ অনেক পিছিয়ে।','2025–26 সালে জলবিভাজিকা বাজেটের মাত্র 40% ব্যবহার হয়েছে।']}

ta:{ui:{app:'MoRD Programmes',eyebrow:'ஊரக வளர்ச்சி அமைச்சகம் · 2026–27',title:'ஊரக வளர்ச்சி அமைச்சகம் என்ன செய்கிறது',sub:'வேலை, வீடு, சாலை, மகளிர் குழுக்கள், திறன், ஓய்வூதியம், நிலம் ஆகியவற்றுக்கான ஏழு திட்டங்கள். ஒவ்வொன்றும் என்ன செய்கிறது, எவ்வளவு சென்றடைந்துள்ளது, எங்கே குறைவு.',programmes:'திட்டங்கள்',budgetTitle:'பணம் எங்கே செல்கிறது, 2026–27',budgetTotal:'₹1,97,023 கோடி',budgetUnit:'பட்ஜெட் மதிப்பீடு, ₹ கோடியில்',timeline:'எப்போது தொடங்கின',tabs:['இது என்ன செய்கிறது','முன்னேற்றம்','சவால்கள்'],started:'தொடக்கம்',budget:'பட்ஜெட் 2026–27',crore:'கோடி',within:'DAY-NRLM பட்ஜெட்டுக்குள்',closing:'MGNREGA (படிப்படியாக நிறுத்தப்படுகிறது)',listen:'கேளுங்கள்',stop:'நிறுத்து',home:'அனைத்துத் திட்டங்கள்',next:'அடுத்த திட்டம்',sources:'ஆதாரங்கள்',disc:'சுயாதீன தகவல், இது அரசு இணையதளம் அல்ல. தரவு: PRS லெஜிஸ்லேட்டிவ் ரிசர்ச், மானியக் கோரிக்கைகள் 2026–27; முன்னேற்றம் டிசம்பர் 2025 வரை.',source:'PRS பகுப்பாய்வைப் படிக்கவும்',noVoice:'இந்தச் சாதனத்தில் இந்த மொழிக்கான குரல் இல்லை. எழுத்தைப் படிக்கவும் அல்லது வேறு மொழியைத் தேர்ந்தெடுக்கவும்.',choose:'மொழியைத் தேர்ந்தெடுக்கவும்'},

work:{name:'ஊரக வேலைவாய்ப்பு',line:'கிராமக் குடும்பங்களுக்குக் கூலி வேலைக்குச் சட்டபூர்வ உறுதி',about:['ஒவ்வொரு கிராமக் குடும்பமும் ஆண்டுக்கு 125 நாட்கள் வரை கூலி வேலை கேட்கலாம். MGNREGA-வில் இது 100 நாட்கள்.','இந்த வேலை குளம், கிணறு, தடுப்பணை, சாலை போன்ற ஊர்ச் சொத்துகளை உருவாக்குகிறது.','இனி செலவை மத்திய, மாநில அரசுகள் 60:40 என்ற விகிதத்தில் பகிர்கின்றன (வடகிழக்கு, இமயமலை மாநிலங்களில் 90:10). 1 ஜூலை 2026 முதல் புதிய சட்டம் MGNREGA-வுக்குப் பதிலாக வருகிறது.'],s1v:'125 நாட்கள்',s1l:'ஒவ்வொரு குடும்பத்துக்கும் ஆண்டுதோறும் வேலை உறுதி',s2v:'48 நாட்கள்',s2l:'கடந்த பத்தாண்டில் ஒரு குடும்பம் ஆண்டுக்குச் சராசரியாகப் பெற்ற வேலை',pct:'சராசரியாக, உறுதியளிக்கப்பட்ட 100 நாட்களில் 48 நாட்கள் வேலை கிடைத்தது',ch:['10 குடும்பங்களில் 1-க்கும் குறைவானவர்களே 100 நாட்கள் வேலையை முடித்தனர்.','2025–26-ல் 31-ல் 20 மாநிலங்கள்/யூனியன் பிரதேசங்களில் அறிவிக்கப்பட்ட விகிதத்தை விடக் குறைவான கூலி வழங்கப்பட்டது.','2025–26-ல் வேலையின்மைப் படி நிலுவையில் 2% மட்டுமே வழங்கப்பட்டது.']},
home:{name:'ஊரக வீட்டுவசதி',line:'நிரந்தர வீடு இல்லாத குடும்பங்களுக்கு வீடு',about:['வீடு கட்ட ₹1.2 லட்சம் (மலைப் பகுதிகளில் ₹1.3 லட்சம்) தவணைகளாக வழங்குகிறது.','வட்டி உதவியுடன் ₹70,000 வரை வங்கிக் கடனும் பெறலாம்.','2016-ல் இந்திரா ஆவாஸ் யோஜனாவுக்குப் பதிலாகத் தொடங்கியது; 2028–29 வரை நீட்டிக்கப்பட்டுள்ளது.'],s1v:'2.89 கோடி',s1l:'வீடுகள் முடிந்தன (டிசம்பர் 2025)',s2v:'4.15 கோடி',s2l:'வீடுகள் இலக்கு',pct:'இலக்கில் 70% முடிந்தது',ch:['நிலமற்ற குடும்பங்கள் முதலில் நிலம் பெற வேண்டியிருப்பதால் நீண்ட காலம் காத்திருக்கின்றன.','2025–26-ல் செலவு பட்ஜெட்டை விட 41% குறைவாக இருந்தது.','உதவியை ஒரு வீட்டுக்கு ₹4 லட்சமாக உயர்த்த நாடாளுமன்றக் குழு பரிந்துரைத்துள்ளது.']},
road:{name:'ஊரகச் சாலைகள்',line:'இணைப்பு இல்லாத ஊர்களுக்கு அனைத்துப் பருவச் சாலைகள்',about:['எல்லாப் பருவங்களிலும் ஊர்களைச் சந்தை, பள்ளி, மருத்துவமனையுடன் இணைக்கும் தார்ச் சாலைகளை அமைக்கிறது.','2000 முதல் நடைபெறுகிறது. நான்காம் கட்டம் (2024–29) 62,500 கி.மீ சாலை மூலம் மேலும் 25,000 குடியிருப்புகளை இணைக்கும்.'],s1v:'7.88 லட்சம் கி.மீ',s1l:'சாலை அமைக்கப்பட்டது',s2v:'8.36 லட்சம் கி.மீ',s2l:'அனுமதிக்கப்பட்டது',pct:'அனுமதிக்கப்பட்ட சாலைகளில் 94% முடிந்தது',ch:['பழங்குடி மற்றும் இடதுசாரித் தீவிரவாதம் பாதித்த பகுதிகளில் வேலை மிக மெதுவாக நடக்கிறது.','தேசியக் கண்காணிப்பாளர்களின் பராமரிப்புச் சோதனைகளில் 24%-ல் சாலைகள் திருப்தியற்றவையாக இருந்தன.']},
women:{name:'மகளிர் சுய உதவிக் குழுக்கள்',line:'மகளிர் குழுக்கள் மூலம் சேமிப்பு, கடன், வாழ்வாதாரம்',about:['ஏழைக் கிராமக் குடும்பப் பெண்களை, ஒன்றாகச் சேமித்துக் கடன் வழங்கும் சுய உதவிக் குழுக்களில் இணைக்கிறது.','குழுக்களுக்கு ₹20,000–30,000 சுழல் நிதியும், வாழ்வாதாரத்தில் முதலீடு செய்ய ₹2.5 லட்சம் வரையும் கிடைக்கும்.','சிறு தொழில் தொடங்க அல்லது வளர்க்கக் குழுக்கள் வங்கிக் கடன் பெறுகின்றன.'],s1v:'92 லட்சம்',s1l:'சுய உதவிக் குழுக்கள், 10 கோடிக்கும் மேற்பட்ட குடும்பங்கள்',s2v:'₹1.2 லட்சம் கோடி',s2l:'2025–26-ல் 44 லட்சம் குழுக்களுக்கு வங்கிக் கடன்',pct:'2025–26-ல் சுமார் 48% குழுக்கள் வங்கிக் கடன் பெற்றன',ch:['2025–26-ல் சுமார் பாதிக் குழுக்கள் வங்கிக் கடன் பெறவில்லை.']},
skills:{name:'ஊரக இளைஞர்களுக்குத் திறன்',line:'வேலைவாய்ப்புடன் இணைந்த இலவசப் பயிற்சி',about:['ஏழைக் கிராமக் குடும்ப இளைஞர்களுக்கு வேலைக்கான இலவசப் பயிற்சி அளிக்கிறது.','பயிற்சி வேலைவாய்ப்புடன் இணைக்கப்பட்டுள்ளது; பயிற்சி பெற்றவர்களில் குறைந்தது 70% பேருக்கு வேலை என்பது வழிகாட்டுதல்.','தேசிய ஊரக வாழ்வாதார இயக்கத்தின் ஒரு பகுதி.'],s1v:'14.7 லட்சம்',s1l:'இளைஞர்கள் பயிற்சி பெற்றனர் (2016 முதல் ஆகஸ்ட் 2025 வரை)',s2v:'69%',s2l:'பயிற்சி பெற்றவர்களுக்கு வேலை கிடைத்தது',pct:'பயிற்சி பெற்ற 100 பேரில் 69 பேருக்கு வேலை கிடைத்தது',ch:['மார்ச் 2025-ல் 2,369 பயிற்சி மையங்களில் 629 மட்டுமே இயங்கின.','வேலைவாய்ப்பு விகிதம் 70% வழிகாட்டுதலை விடச் சற்றுக் குறைவு.']},
pension:{name:'சமூக ஓய்வூதியங்கள்',line:'முதியோர், விதவைகள், மாற்றுத்திறனாளிகளுக்கு மாத ஓய்வூதியம்',about:['ஐந்து திட்டங்கள்: முதியோர், விதவை, மாற்றுத்திறனாளி ஓய்வூதியம், குடும்ப நலன், அன்னபூர்ணா உணவு உதவி.','முதியோர் ஓய்வூதியத்துக்கு மத்திய அரசு மாதம் ₹200 (80 வயது முதல் ₹500) வழங்குகிறது; மாநிலங்கள் ₹50 முதல் ₹3,200 வரை சேர்க்கின்றன.','வறுமைக் கோட்டுக்குக் கீழ் உள்ள குடும்பங்களுக்காக மாநிலங்கள் செயல்படுத்துகின்றன.'],s1v:'₹200–500',s1l:'மத்திய அரசின் மாத முதியோர் ஓய்வூதியம்',s2v:'67%',s2l:'2025–26-ல் ஓய்வூதிய நிதி பயன்பாடு',ch:['நிதி அனுப்புவதில் தாமதம் இருப்பதாக CAG தணிக்கை கண்டறிந்தது.','சில மாநிலங்கள் மாதந்தோறும் அல்ல, காலாண்டுக்கு அல்லது ஆண்டுக்கு ஒருமுறை வழங்குகின்றன.','தொகை வாழ்க்கைச் செலவுக்கு ஏற்ப உயரவில்லை.']},
land:{name:'நிலப் பதிவுகள், நீர்வடிப் பகுதிகள்',line:'டிஜிட்டல் நிலப் பதிவுகள், மழையை நம்பிய நிலத்தின் சிறந்த பயன்பாடு',about:['நிலப் பதிவுகளைக் கணினிமயமாக்கி, ஊர் வரைபடங்களை டிஜிட்டல் ஆக்குகிறது; உரிமையைச் சரிபார்ப்பது எளிதாகிறது.','நீர்வடிப் பகுதித் திட்டங்கள் மழையை நம்பிய, தரம் குறைந்த நிலத்தில் தடுப்பணை, குளம், மண் பணிகளைச் செய்கின்றன.','நில வளத் துறை செயல்படுத்துகிறது.'],s1v:'100%',s1l:'நிலப் பதிவுகள் (உரிமைப் பதிவு) கணினியில்',s2v:'15%',s2l:'திட்டமிட்ட நில அளவை, மறு அளவை முடிந்தது',pct:'திட்டமிட்ட அளவைகளில் 15% முடிந்தது',ch:['நில அளவை, மறு அளவைப் பணிகள் மிகவும் பின்தங்கியுள்ளன.','2025–26-ல் நீர்வடிப் பகுதி பட்ஜெட்டில் 40% மட்டுமே பயன்படுத்தப்பட்டது.']}
}},
te:{ui:{app:'MoRD Programmes',eyebrow:'గ్రామీణాభివృద్ధి మంత్రిత్వ శాఖ · 2026–27',title:'గ్రామీణాభివృద్ధి మంత్రిత్వ శాఖ ఏమి చేస్తుంది',sub:'పని, ఇల్లు, రోడ్లు, మహిళా సంఘాలు, నైపుణ్యాలు, పింఛన్లు, భూమి కోసం ఏడు కార్యక్రమాలు. ఒక్కొక్కటి ఏమి చేస్తుంది, ఎంత వరకు చేరింది, ఎక్కడ లోటు ఉంది.',programmes:'కార్యక్రమాలు',budgetTitle:'డబ్బు ఎక్కడికి వెళ్తుంది, 2026–27',budgetTotal:'₹1,97,023 కోట్లు',budgetUnit:'బడ్జెట్ అంచనా, ₹ కోట్లలో',timeline:'ఎప్పుడు మొదలయ్యాయి',tabs:['ఇది ఏమి చేస్తుంది','పురోగతి','సవాళ్లు'],started:'ప్రారంభం',budget:'బడ్జెట్ 2026–27',crore:'కోట్లు',within:'DAY-NRLM బడ్జెట్‌లో భాగం',closing:'MGNREGA (దశలవారీగా ముగుస్తోంది)',listen:'వినండి',stop:'ఆపండి',home:'అన్ని కార్యక్రమాలు',next:'తర్వాతి కార్యక్రమం',sources:'ఆధారాలు',disc:'స్వతంత్ర సమాచారం, ఇది ప్రభుత్వ వెబ్‌సైట్ కాదు. సమాచారం: PRS లెజిస్లేటివ్ రీసెర్చ్, గ్రాంట్ల డిమాండ్ 2026–27; పురోగతి డిసెంబర్ 2025 వరకు.',source:'PRS విశ్లేషణ చదవండి',noVoice:'ఈ పరికరంలో ఈ భాషకు గొంతు లేదు. రాసినది చదవండి లేదా వేరే భాష ఎంచుకోండి.',choose:'భాషను ఎంచుకోండి'},

work:{name:'గ్రామీణ ఉపాధి',line:'గ్రామీణ కుటుంబాలకు కూలీ పనికి చట్టబద్ధమైన హామీ',about:['ప్రతి గ్రామీణ కుటుంబం ఏడాదికి 125 రోజుల వరకు కూలీ పని అడగవచ్చు. MGNREGAలో ఇది 100 రోజులు.','ఈ పని ద్వారా చెరువులు, బావులు, చెక్ డ్యామ్‌లు, రోడ్ల వంటి గ్రామ ఆస్తులు ఏర్పడతాయి.','ఇప్పుడు ఖర్చును కేంద్రం, రాష్ట్రాలు 60:40 నిష్పత్తిలో పంచుకుంటాయి (ఈశాన్య, హిమాలయ రాష్ట్రాల్లో 90:10). 1 జూలై 2026 నుండి కొత్త చట్టం MGNREGA స్థానంలో వస్తోంది.'],s1v:'125 రోజులు',s1l:'ప్రతి కుటుంబానికి ఏటా పనికి హామీ',s2v:'48 రోజులు',s2l:'గత దశాబ్దంలో ఒక కుటుంబానికి ఏడాదికి సగటున దొరికిన పని',pct:'సగటున, హామీ ఇచ్చిన 100 రోజుల్లో 48 రోజుల పని దొరికింది',ch:['10 కుటుంబాల్లో 1 కంటే తక్కువ కుటుంబాలే 100 రోజుల పని పూర్తి చేశాయి.','2025–26లో 31లో 20 రాష్ట్రాలు/కేంద్రపాలిత ప్రాంతాల్లో నిర్ణయించిన రేటు కంటే తక్కువ కూలీ చెల్లించారు.','2025–26లో నిరుద్యోగ భృతి బకాయిల్లో 2% మాత్రమే చెల్లించారు.']},
home:{name:'గ్రామీణ గృహనిర్మాణం',line:'పక్కా ఇల్లు లేని కుటుంబాలకు ఇల్లు',about:['ఇల్లు కట్టుకోవడానికి ₹1.2 లక్షలు (కొండ ప్రాంతాల్లో ₹1.3 లక్షలు) విడతలుగా ఇస్తుంది.','వడ్డీ సహాయంతో ₹70,000 వరకు బ్యాంకు రుణం కూడా తీసుకోవచ్చు.','2016లో ఇందిరా ఆవాస్ యోజన స్థానంలో ప్రారంభమైంది; 2028–29 వరకు పొడిగించారు.'],s1v:'2.89 కోట్లు',s1l:'ఇళ్ళు పూర్తయ్యాయి (డిసెంబర్ 2025)',s2v:'4.15 కోట్లు',s2l:'ఇళ్ళ లక్ష్యం',pct:'లక్ష్యంలో 70% పూర్తయింది',ch:['భూమి లేని కుటుంబాలకు ముందు భూమి కావాలి కాబట్టి ఎక్కువ కాలం ఎదురుచూస్తున్నాయి.','2025–26లో ఖర్చు బడ్జెట్ కంటే 41% తక్కువగా ఉంది.','సహాయాన్ని ఒక్కో ఇంటికి ₹4 లక్షలకు పెంచాలని పార్లమెంటరీ కమిటీ సిఫార్సు చేసింది.']},
road:{name:'గ్రామీణ రోడ్లు',line:'రోడ్డు లేని గ్రామాలకు అన్ని కాలాల రోడ్లు',about:['అన్ని కాలాల్లో గ్రామాలను మార్కెట్లు, బడులు, ఆసుపత్రులతో కలిపే పక్కా రోడ్లు నిర్మిస్తుంది.','2000 నుండి నడుస్తోంది. నాలుగో దశ (2024–29) 62,500 కి.మీ రోడ్లతో మరో 25,000 నివాస ప్రాంతాలను కలుపుతుంది.'],s1v:'7.88 లక్షల కి.మీ',s1l:'రోడ్లు నిర్మించారు',s2v:'8.36 లక్షల కి.మీ',s2l:'మంజూరు',pct:'మంజూరైన రోడ్లలో 94% పూర్తి',ch:['గిరిజన, వామపక్ష తీవ్రవాద ప్రభావిత ప్రాంతాల్లో పని అత్యంత నెమ్మదిగా ఉంది.','జాతీయ పర్యవేక్షకుల నిర్వహణ తనిఖీల్లో 24%లో రోడ్లు సంతృప్తికరంగా లేవు.']},
women:{name:'మహిళా స్వయం సహాయక సంఘాలు',line:'మహిళా సంఘాల ద్వారా పొదుపు, రుణం, జీవనోపాధి',about:['పేద గ్రామీణ కుటుంబాల మహిళలను కలిసి పొదుపు చేసి రుణాలిచ్చే స్వయం సహాయక సంఘాల్లో చేర్చుతుంది.','సంఘాలకు ₹20,000–30,000 రివాల్వింగ్ ఫండ్, జీవనోపాధిలో పెట్టుబడికి ₹2.5 లక్షల వరకు లభిస్తాయి.','చిన్న వ్యాపారాలు మొదలుపెట్టడానికి లేదా పెంచడానికి సంఘాలు బ్యాంకు రుణాలు తీసుకుంటాయి.'],s1v:'92 లక్షలు',s1l:'స్వయం సహాయక సంఘాలు, 10 కోట్లకు పైగా కుటుంబాలు',s2v:'₹1.2 లక్షల కోట్లు',s2l:'2025–26లో 44 లక్షల సంఘాలకు బ్యాంకు రుణాలు',pct:'2025–26లో సుమారు 48% సంఘాలు బ్యాంకు రుణం తీసుకున్నాయి',ch:['2025–26లో దాదాపు సగం సంఘాలు బ్యాంకు రుణం తీసుకోలేదు.']},
skills:{name:'గ్రామీణ యువతకు నైపుణ్యాలు',line:'ఉద్యోగంతో ముడిపడిన ఉచిత శిక్షణ',about:['పేద గ్రామీణ కుటుంబాల యువతకు ఉద్యోగం కోసం ఉచిత శిక్షణ ఇస్తుంది.','శిక్షణ ఉద్యోగ కల్పనతో ముడిపడి ఉంది; శిక్షణ పొందినవారిలో కనీసం 70% మందికి ఉద్యోగం అనేది మార్గదర్శకం.','జాతీయ గ్రామీణ జీవనోపాధి మిషన్‌లో భాగం.'],s1v:'14.7 లక్షలు',s1l:'యువత శిక్షణ పొందారు (2016 నుండి ఆగస్టు 2025 వరకు)',s2v:'69%',s2l:'శిక్షణ పొందినవారికి ఉద్యోగం వచ్చింది',pct:'శిక్షణ పొందిన ప్రతి 100 మందిలో 69 మందికి ఉద్యోగం వచ్చింది',ch:['మార్చి 2025లో 2,369 శిక్షణ కేంద్రాల్లో 629 మాత్రమే నడుస్తున్నాయి.','ఉద్యోగ రేటు 70% మార్గదర్శకం కంటే కొంచెం తక్కువ.']},
pension:{name:'సామాజిక పింఛన్లు',line:'వృద్ధులు, వితంతువులు, దివ్యాంగులకు నెలవారీ పింఛను',about:['ఐదు పథకాలు: వృద్ధాప్య, వితంతు, వికలాంగ పింఛన్లు, కుటుంబ ప్రయోజనం, అన్నపూర్ణ ఆహార సహాయం.','వృద్ధాప్య పింఛనుకు కేంద్రం నెలకు ₹200 (80 ఏళ్ల నుండి ₹500) ఇస్తుంది; రాష్ట్రాలు ₹50 నుండి ₹3,200 వరకు కలుపుతాయి.','దారిద్ర్య రేఖకు దిగువన ఉన్న కుటుంబాల కోసం రాష్ట్రాలు అమలు చేస్తాయి.'],s1v:'₹200–500',s1l:'కేంద్రం నెలవారీ వృద్ధాప్య పింఛను',s2v:'67%',s2l:'2025–26లో పింఛను నిధుల వినియోగం',ch:['నిధుల బదిలీలో ఆలస్యం ఉందని CAG ఆడిట్ గుర్తించింది.','కొన్ని రాష్ట్రాలు నెలనెలా కాకుండా మూడు నెలలకు లేదా ఏడాదికి ఒకసారి చెల్లిస్తున్నాయి.','మొత్తం జీవన వ్యయానికి తగ్గట్టు పెరగలేదు.']},

work:{name:'ग्रामीण रोजगार',line:'ग्रामीण कुटुंबांना मजुरीच्या कामाची कायदेशीर हमी',about:['प्रत्येक ग्रामीण कुटुंब वर्षाला 125 दिवसांपर्यंत मजुरीचे काम मागू शकते. मनरेगामध्ये हे 100 दिवस होते.','या कामातून गावात तलाव, विहिरी, बंधारे आणि रस्ते अशी मालमत्ता तयार होते.','आता खर्च केंद्र आणि राज्ये 60:40 प्रमाणात वाटून घेतात (ईशान्य आणि हिमालयीन राज्यांत 90:10). 1 जुलै 2026 पासून नवा कायदा मनरेगाची जागा घेत आहे.'],s1v:'125 दिवस',s1l:'प्रत्येक कुटुंबाला दर वर्षी कामाची हमी',s2v:'48 दिवस',s2l:'गेल्या दशकात एका कुटुंबाला वर्षाला सरासरी प्रत्यक्ष मिळालेले काम',pct:'सरासरी, हमी दिलेल्या 100 पैकी 48 दिवस काम मिळाले',ch:['10 पैकी 1 पेक्षाही कमी कुटुंबांनी 100 दिवसांचे काम पूर्ण केले.','2025–26 मध्ये 31 पैकी 20 राज्ये/केंद्रशासित प्रदेशांत ठरलेल्या दरापेक्षा कमी मजुरी दिली गेली.','2025–26 मध्ये बेरोजगारी भत्त्याच्या थकबाकीपैकी फक्त 2% दिले गेले.']},
home:{name:'ग्रामीण घरकुल',line:'पक्के घर नसलेल्या कुटुंबांसाठी घर',about:['घर बांधण्यासाठी ₹1.2 लाख (डोंगराळ भागात ₹1.3 लाख) हप्त्यांमध्ये देते.','कुटुंबे व्याज सवलतीसह ₹70,000 पर्यंत बँक कर्जही घेऊ शकतात.','2016 मध्ये इंदिरा आवास योजनेच्या जागी सुरू; 2028–29 पर्यंत वाढवली.'],s1v:'2.89 कोटी',s1l:'घरे पूर्ण (डिसेंबर 2025)',s2v:'4.15 कोटी',s2l:'घरांचे लक्ष्य',pct:'लक्ष्याच्या 70% पूर्ण',ch:['भूमिहीन कुटुंबांना आधी जमीन लागते, म्हणून त्यांना सर्वात जास्त वाट पाहावी लागते.','2025–26 मध्ये खर्च बजेटपेक्षा 41% कमी झाला.','संसदीय समितीने मदत वाढवून प्रति घर ₹4 लाख करण्याची शिफारस केली आहे.']},

/* speech */
const synth = window.speechSynthesis; let speakTok=0, speaking=null;
function allVoices(){ try{ return (synth&&synth.getVoices())||[]; }catch(e){ return []; } }
function voicesFor(l){ const pre=SPEECH[l].split('-')[0]; return allVoices().filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(pre)); }
function vScore(v,code){ const n=v.name||''; let s=0;
  if (/linda/i.test(n)) s+=9;
  if (/natural|neural|wavenet|studio/i.test(n)) s+=7;
  if (/google/i.test(n)) s+=5;
  if (/premium|enhanced/i.test(n)) s+=4;
  if (/online/i.test(n)) s+=1;
  if (v.lang.replace('_','-').toLowerCase()===code.toLowerCase()) s+=3;
  if (/espeak|compact|eloquence/i.test(n)) s-=6;
  return s; }
function prefKey(){ return 'rde-voice-'+lang; }
function pickVoice(){
  const list=voicesFor(lang); if (!list.length) return allVoices().length?null:undefined;
  let pref=null; try{ pref=localStorage.getItem(prefKey()); }catch(e){}
  if (pref){ const v=list.find(x=>x.voiceURI===pref||x.name===pref); if (v) return v; }
  const code=SPEECH[lang]; return list.slice().sort((a,b)=>vScore(b,code)-vScore(a,code))[0]; }
function chunks(text){
  const parts=String(text).replace(/([.!?।])\s+/g,'$1\u0001').split('\u0001'); const out=[]; let cur='';
  parts.forEach(p=>{ if ((cur+' '+p).length>220 && cur){ out.push(cur); cur=p; } else cur=cur?cur+' '+p:p; });
  if (cur) out.push(cur); return out; }
function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,4500); }
function setListen(b,on){ if(!b) return; b.innerHTML=ic(on?'stop':'speaker')+`<span class="t">${esc(on?L().ui.stop:L().ui.listen)}</span>`; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false'); b.setAttribute('aria-label',on?L().ui.stop:L().ui.listen); }
function stopSpeak(){ speakTok++; if (synth) synth.cancel(); speaking=null; document.querySelectorAll('.listen').forEach(b=>setListen(b,false)); }
function speak(text,b){
  if (!synth || typeof SpeechSynthesisUtterance==='undefined'){ toast(L().ui.noVoice); return; }
  if (b && speaking===b){ stopSpeak(); return; } stopSpeak();
  const v=pickVoice(); if (v===null){ toast(L().ui.noVoice); return; }
  const tok=++speakTok, q=chunks(text); speaking=b||null; setListen(b,true);
  const next=i=>{ if (tok!==speakTok) return; if (i>=q.length){ if (speaking===b) stopSpeak(); return; }
    const u=new SpeechSynthesisUtterance(q[i]); u.lang=SPEECH[lang]; if (v) u.voice=v; u.rate=0.95; u.pitch=1;
    u.onend=()=>next(i+1); u.onerror=()=>{ if (tok===speakTok) stopSpeak(); };
    synth.speak(u); };
  setTimeout(()=>next(0), 80);
}
function voiceOptions(){ const u=L().ui, list=voicesFor(lang); let pref='auto'; try{ pref=localStorage.getItem(prefKey())||'auto'; }catch(e){}
  return `<option value="auto">${esc(u.voiceAuto)}${list.length?` (${esc(pickVoice()?.name||'')})`:''}</option>`+
    list.map(v=>`<option value="${esc(v.voiceURI)}"${v.voiceURI===pref?' selected':''}>${esc(v.name)}</option>`).join(''); }
if (synth && 'onvoiceschanged' in synth) synth.onvoiceschanged=()=>{ const s=$('voiceSel'); if (s) s.innerHTML=voiceOptions(); };
function sayText(){
  const u=L().ui, P=L().p;
  if (screen==='lang') return u.choose;
  if (screen==='home') return [u.title, u.sub, ...ORDER.map(k=>P[k].name+'. '+P[k].line)].join('. ').replace(/([.।])\./g,'$1');
  const p=P[cur], parts=[p.name,p.line,u.tabs[tab]];
  if (tab===0) parts.push(...p.about);
  if (tab===1) p.st.forEach(([t,l],j)=>parts.push((j+1)+'. '+t+'. '+l));
  if (tab===2){ parts.push(p.s1v+' '+p.s1l, p.s2v+' '+p.s2l); if (META[cur].pct!=null&&p.pct) parts.push(p.pct); }
  if (tab===3) parts.push(...p.ch);
  return parts.join('. ').replace(/([.।])\./g,'$1');
}

function mfmt(m,v,st){ const u=L().ui;
  if (v===null) return u.nodata;
  if (m==='home') return v[0]+'%';
  if (m==='road') return num(v)+' km';
  if (m==='work') return v===0 ? (st==='West Bengal'?'0':u.under1) : `${v} ${u.lakh}`;
  return num(v); }
function legendLabels(m){ const b=BRK[m], u=L().ui;
  const f = m==='home'?(x=>x+'%'):m==='work'?(x=>x):m==='women'?lk:num;
  const tail = m==='work'?' '+u.lakh:'';
  return ['< '+f(b[0])+tail, f(b[0])+'–'+f(b[1])+tail, f(b[1])+'–'+f(b[2])+tail, f(b[2])+'–'+f(b[3])+tail, f(b[3])+'+'+tail]; }

  const lab=legendLabels(m);
  return `<div class="mapbox" data-metric="${m}" data-tabs="${tabs?1:0}">
    ${tabs?`<div class="tabs mtabs" role="tablist">${MAPK.map(k=>`<button class="tab" type="button" role="tab" aria-selected="${k===m}" data-metric="${k}">${ic(k)}<span>${esc(L().p[k].name)}</span></button>`).join('')}</div>`:''}

        ${order.map(s=>{ const v=mv(m,s); return `<path d="${GEO[s]}" class="${mcls(m,v)}${s===sel?' on':''}" data-st="${esc(s)}"><title>${esc(s)}: ${esc(mfmt(m,v,s))}</title></path>`; }).join('')}
      </svg></figure>

}

function renderLang(){
  $('s-lang').innerHTML=`<div class="wrap lwrap">
    <div class="crumbrow"><button class="crumb" type="button" data-go="back">${ic('back')}<span>${esc(cur&&lastScreen==='prog'?L().p[cur].name:L().ui.home)}</span></button></div>
    <p class="eyebrow">Language · भाषा · ভাষা · மொழி · భాష</p><h1 class="h2">${esc(L().ui.choose)}</h1>
    <div class="langs">${LANGS.map(([c,n,e])=>`<button class="lang" type="button" lang="${c}" data-lang="${c}" aria-pressed="${c===lang}"><b>${n}</b><small lang="en">${e}</small></button>`).join('')}</div>
    <div class="voicebox"><label for="voiceSel">${esc(L().ui.voice)}</label>
      <span class="sel"><select id="voiceSel">${voiceOptions()}</select><svg class="ico c" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
      <button class="pill accent listen-test" type="button" data-vtest="1">${ic('speaker')}<span>${esc(L().ui.voiceTest)}</span></button>
      <p>${esc(L().ui.voiceNote)}</p></div></div>`;
}

let lastScreen='home';
function show(id){ ['s-home','s-prog','s-lang'].forEach(s=>$(s).hidden=(s!==id)); }
function setHash(h, push){ const url=h?'#'+h:location.pathname+location.search; if ((location.hash||'')===(h?'#'+h:'')) return;
  try{ push ? history.pushState(null,'',url) : history.replaceState(null,'',url); }catch(e){} }
function render(){ if (screen==='prog') renderProg(); else if (screen==='lang') renderLang(); else renderHome(); }
function go(scr,k,fromHistory){ stopSpeak();
  if (scr!=='lang') lastScreen=scr;
  screen=scr; mapState=null; if (scr==='prog'){ cur=k; tab=0; }
  render(); show('s-'+scr); window.scrollTo(0,0);
  if (!fromHistory) setHash(scr==='prog'?k:scr==='lang'?'languages':'', true); }
function setLang(c){ lang=c; try{localStorage.setItem('rde-lang',c);}catch(e){} stopSpeak(); chrome(); }
function setLarge(on){ large=on; try{localStorage.setItem('rde-large',on?'1':'0');}catch(e){} chrome(); }

document.addEventListener('change', e=>{ if (e.target.id==='voiceSel'){ try{ if (e.target.value==='auto') localStorage.removeItem(prefKey()); else localStorage.setItem(prefKey(), e.target.value); }catch(err){} } });
document.addEventListener('click', e=>{ const p=e.target.closest('path[data-st]'); if (!p) return; const box=p.closest('.mapbox'); mapState=p.dataset.st; rerenderMap(box); });
$('langSel').addEventListener('change', e=>{ const y=window.scrollY; setLang(e.target.value); render(); window.scrollTo(0,y); });

document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if (!b) return;
  if (b.dataset.skip){ const m=$('main'); m.focus(); m.scrollIntoView(); return; }
  if (b.dataset.metric){ mapMetric=b.dataset.metric; mapState=null; const box=b.closest('.mapbox'); box.dataset.metric=mapMetric; rerenderMap(box); return; }
  if (b.dataset.st){ const box=b.closest('.mapbox'); mapState=b.dataset.st; rerenderMap(box); return; }
  if (b.dataset.vtest){ stopSpeak(); speak(L().ui.title+'. '+L().ui.sub, null); return; }
  if (b.dataset.lang){ setLang(b.dataset.lang); go(lastScreen, cur); return; }
  if (b.dataset.prog){ go('prog',b.dataset.prog); return; }
  if (b.dataset.tab){ stopSpeak(); tab=+b.dataset.tab; renderProg(); return; }
  if (b.dataset.large){ setLarge(!large); return; }
  if (b.dataset.scroll){ const t=$(b.dataset.scroll); if (t) t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); return; }
  if (b.dataset.say){ const target = b.dataset.tile ? $('hdrListen') : b; speak(sayText(), target); return; }
  if (b.dataset.go==='back'){ if (history.length>1 && location.hash==='#languages') history.back(); else go(lastScreen, cur); return; }
  if (b.dataset.go==='lang'){ go('lang'); return; }
  if (b.dataset.go==='home'||b.id==='brand'){ go('home'); return; }
});

chrome();
function route(fromHistory){ const h=(location.hash||'').replace('#','');
  if (ORDER.includes(h)) go('prog',h,fromHistory); else if (h==='languages') go('lang',null,fromHistory); else go('home',null,fromHistory); }
window.addEventListener('popstate', ()=>route(true));
route(true);
})();

</script>
</body>
</html>
